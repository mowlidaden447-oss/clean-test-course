name: Automated Testing Pipeline

on:
  push:
    branches: [ main, master, lesson-2, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/hangry_api
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest coverage django-mock-queries
    
    - name: Run unit tests
      run: |
        python -m coverage run --source=. -m pytest
        python -m coverage report
        python -m coverage xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Run Django check
      run: python manage.py check
    
    - name: Run Django migrations check
      run: python manage.py makemigrations --check

  deploy:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend/hangry_api
        pip install -r requirements.txt
    
    - name: Disable Debug
      run: |
        cd backend/hangry_api
        sed -i 's/DEBUG = True/DEBUG = False/g' hangry_api/settings.py
    
    - name: Generate deployment package
      run: |
        cd backend/hangry_api
        zip -r deploy.zip . -x '*.git*' '*.pyc' '__pycache__/*'
    
    - name: Upload deployment artifact
      uses: actions/upload-artifact@v3
      with:
        name: deployment-package
        path: backend/hangry_api/deploy.zip
    
    - name: Deploy to staging
      run: echo "Deployment to staging environment completed"
